<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Collection d'albums de musique Suno AI hébergés sur Archive.org">
  <meta name="theme-color" content="#9333ea">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Mes Albums - Collection Musicale">
  <meta property="og:description" content="Collection d'albums de musique Suno AI">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icon-512.png">
  
  <title>🎵 Mes Albums - Collection Musicale</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Animations personnalisées */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    
    /* Style scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #9333ea;
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #a855f7;
    }

    /* Effet de brillance sur les cartes */
    .card-shine {
      position: relative;
      overflow: hidden;
    }
    
    .card-shine::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent,
        rgba(255, 255, 255, 0.1),
        transparent
      );
      transform: rotate(45deg);
      transition: all 0.5s;
    }
    
    .card-shine:hover::before {
      left: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Installation PWA Banner -->
  <div id="install-banner" style="display: none;" class="fixed bottom-20 left-4 right-4 md:left-auto md:right-4 md:w-96 bg-purple-900 text-white p-4 rounded-lg shadow-2xl z-50 border border-purple-500">
    <div class="flex items-center justify-between mb-2">
      <h3 class="font-bold">📱 Installer l'application</h3>
      <button id="close-banner" class="text-2xl hover:text-purple-300">&times;</button>
    </div>
    <p class="text-sm mb-3">Installez cette PWA pour un accès rapide et une utilisation offline !</p>
    <div class="flex gap-2">
      <button id="install-button" class="flex-1 bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition">
        Installer
      </button>
      <button id="later-button" class="flex-1 bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition">
        Plus tard
      </button>
    </div>
  </div>

  <script type="module">
    // Votre code React sera injecté ici par le build
  </script>
  
  <script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('Service Worker enregistré:', registration);
          })
          .catch(error => {
            console.log('Erreur Service Worker:', error);
          });
      });
    }

    // Gestion de l'installation PWA
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installButton = document.getElementById('install-button');
    const closeBanner = document.getElementById('close-banner');
    const laterButton = document.getElementById('later-button');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Affiche le banner après 3 secondes
      setTimeout(() => {
        installBanner.style.display = 'block';
      }, 3000);
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      
      console.log(`Installation: ${outcome}`);
      deferredPrompt = null;
      installBanner.style.display = 'none';
    });

    closeBanner.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    laterButton.addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    // Notification quand l'app est installée
    window.addEventListener('appinstalled', () => {
      console.log('PWA installée avec succès!');
      installBanner.style.display = 'none';
    });
  </script>
</body>
</html>
