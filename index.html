<!-- ========== index.html ========== -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PWA Albums - Archive.org Player</title>
<meta name="description" content="Progressive Web App pour lire vos albums hébergés sur Archive.org" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f172a" />
<style>
/* style minimal, moderne */
:root{--bg:#0b1220;--card:#0f172a;--muted:#9aa4b2;--accent:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#071123 0%, #071426 100%);color:#e6eef6;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:18px 20px}
h1{margin:0;font-size:1.1rem}
.container{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px;align-items:start}
@media(max-width:900px){.container{grid-template-columns:1fr;}
header{justify-content:center}
}
.sidebar{background:rgba(255,255,255,0.03);padding:16px;border-radius:12px}
.input-group{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:120px;padding:10px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;font-family:monospace}
button{background:linear-gradient(90deg,var(--accent),#60a5fa);border:none;padding:10px 12px;border-radius:10px;color:#04233a;font-weight:600;cursor:pointer}
.albums-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto}
.album{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.album:hover{background:rgba(255,255,255,0.02)}
.cover{width:64px;height:64px;border-radius:6px;background:linear-gradient(180deg,#1f2937,#0b1220);object-fit:cover}
.meta{display:flex;flex-direction:column}
.meta .title{font-weight:700}
.meta .sub{color:var(--muted);font-size:0.9rem}


/* player */
.player{background:rgba(255,255,255,0.03);padding:18px;border-radius:12px;min-height:320px}
.player-top{display:flex;gap:16px;align-items:center}
.player-controls{display:flex;gap:12px;align-items:center;margin-top:12px}
.play-btn{width:56px;height:56px;border-radius:14px;border:none;font-size:18px;display:grid;place-items:center;background:var(--accent);color:#04233a}
.progress{width:100%;height:8px;background:rgba(255,255,255,0.05);border-radius:10px;margin-top:12px;position:relative}
.progress > i{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#7dd3fc);border-radius:10px}
.playlist{margin-top:16px;max-height:38vh;overflow:auto}
.track{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px}
.track:hover{background:rgba(255,255,255,0.02)}
.muted{color:var(--muted)}


footer{padding:12px;text-align:center;color:var(--muted);font-size:0.9rem}


</style>
</head>
<body>
<header>
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect rx='10' width='44' height='44' fill='%23071a2b'/><text x='50%' y='55%' font-size='16' text-anchor='middle' fill='%237dd3fc' font-family='Arial'>PWA</text></svg>" alt="logo" style="width:44px;height:44px;border-radius:10px;"/>
<div>
<h1>PWA Albums — Archive.org Player</h1>
<div style="color:var(--muted);font-size:0.95rem">Colle tes URLs (ou JSON) puis clique <strong>Parser et Charger Album</strong>.</div>
</div>
</header>


<main class="container">
<aside class="sidebar">
<div class="input-group">
<label class="muted">Coller les URLs (même sans séparateurs) :</label>
<textarea id="urlsInput" placeholder="Colle ici les URLs, ex : https://archive.org/download/noel-skyline/01-...mp3https://archive.org/download/noel-skyline/02-...mp3"></textarea>
<div style="display:flex;gap:8px">
<button id="parseBtn">Parser et Charger Album</button>
<button id="clearBtn" style="background:transparent;color:var(--accent);border:1px solid rgba(125,211,252,0.25)">Effacer</button>
</div>
</div>


<div style="margin-top:12px">
<label class="muted">Albums détectés :</label>
<div id="albumsList" class="albums-list"></div>
</div>


<div style="margin-top:16px">
<label class="muted">Importer JSON :</label>
<input id="fileInput" type="file" accept="application/json" />
</div>
</aside>
